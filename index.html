<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Campanha URM 2026</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: #f6f8f7;
      font-family: Arial, Helvetica, sans-serif;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .wrap {
      width: 100%;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }
    img {
      display: block;
      width: 100%;
      max-width: 1080px;
      height: auto;
      object-fit: contain;
    }
    .erro {
      padding: 28px;
      text-align: center;
      color: #12365c;
      font-size: 18px;
      line-height: 1.45;
    }
  </style>
</head>
<body>
  <main class="wrap" id="app"></main>

  <script>
    const telas = {
      premio: "dosepremiada.png",
      horario: "horariocerto.png",
      dose: "naoalterar.png",
      compartilhar: "naocompartilha.png",
      organizar: "organizar.png",
      tratamento: "sentindobem.png"
    };

    const params = new URLSearchParams(window.location.search);
    const tipo = params.get("t");
    const app = document.getElementById("app");

    if (tipo && telas[tipo]) {
      const img = document.createElement("img");
      img.src = telas[tipo] + "?v=2";
      img.alt = "Campanha de Uso Racional de Medicamentos 2026";
      app.appendChild(img);
    } else {
      app.innerHTML = `
        <div class="erro">
          <strong>Campanha de Uso Racional de Medicamentos 2026</strong><br><br>
          Este endereço deve ser acessado por um QR Code da campanha.
        </div>
      `;
    }
  </script>
</body>
</html>
